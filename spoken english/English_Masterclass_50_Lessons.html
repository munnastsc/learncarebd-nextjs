        function renderSidebar() {

            lessons.forEach(lesson => {
                const li = document.createElement('li');
                li.className = `lesson-btn p-3 rounded cursor-pointer transition-colors font-medium border border-transparent hover:border-blue-200 hover:bg-blue-50 text-gray-700 ${lesson.id === currentLessonId ? 'active' : ''}`;
                li.textContent = lesson.title;
                li.onclick = () => loadLesson(lesson.id);

            });
        }

        function loadLesson(id) {
            currentLessonId = id;
            synthesis.cancel(); // stop playing audio if switching
            renderSidebar();
            
            const lesson = lessons.find(l => l.id === id);
            
            document.getElementById('lesson-title').textContent = lesson.title;
            document.getElementById('grammar-text').innerHTML = lesson.grammar;
            document.getElementById('multiple-ways-text').innerHTML = lesson.multiple_ways;
            
            const container = document.getElementById('conversation-container');
            container.innerHTML = '';

            lesson.conversation.forEach((line, index) => {
                const isA = line.speaker === 'A';
                
                const wrapper = document.createElement('div');
                wrapper.className = `flex w-full ${isA ? 'justify-start' : 'justify-end'}`;
                
                const avatar = `<div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 ${isA ? 'bg-blue-500 mr-3' : 'bg-green-500 ml-3'}">${line.speaker}</div>`;
                
                const bubble = `

                        <div class="font-bold text-lg text-gray-900 mb-1 flex justify-between items-center">
                            <span>${line.en}</span>

                wrapper.innerHTML = isA ? avatar + bubble : bubble + avatar;
                container.appendChild(wrapper);
            });
        }

        function playSingle(text) {
            synthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB'; // British English
            synthesis.speak(utterance);
        }

        function playFullAudio() {
            synthesis.cancel();
            const lesson = lessons.find(l => l.id === currentLessonId);
            lesson.conversation.forEach(line => {

                // Slight voice tweak based on speaker
                utterance.pitch = line.speaker === 'A' ? 1 : 1.2;
                synthesis.speak(utterance);
            });
        }
