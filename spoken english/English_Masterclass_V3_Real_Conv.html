lp them.", "bn": "না, তারা তাদের সাহায্য করবে না।", "ipa": "/nəʊ /ðeɪ/ /wəʊnt/ /help/ /ðəm//", "bn_pron": "নো, দেই ওন্ট হেল্প দেম।"}, {"speaker": "A", "type": "practice", "en": "Will they write a letter?", "bn": "তারা কি একটি চিঠি লিখবে?", "ipa": "/wɪl /ðeɪ/ /raɪt/ /ə ˈletə/?", "bn_pron": "উইল দেই রাইট আ লেটা?"}, {"speaker": "B", "type": "practice", "en": "Yes, they will write a letter.", "bn": "হ্যাঁ, তারা একটি চিঠি লিখবে।", "ipa": "/jes /ðeɪ/ /wɪl/ /raɪt/ /ə ˈletə//", "bn_pron": "ইয়েস, দেই উইল রাইট আ লেটা।"}, {"speaker": "A", "type": "practice", "en": "Will they sleep early?", "bn": "তারা কি তাড়াতাড়ি ঘুমাবে?", "ipa": "/wɪl /ðeɪ/ /sliːp/ /ˈɜːli/?", "bn_pron": "উইল দেই স্লীপ আলি?"}, {"speaker": "B", "type": "practice", "en": "No, they won't sleep early.", "bn": "না, তারা তাড়াতাড়ি ঘুমাবে না।", "ipa": "/nəʊ /ðeɪ/ /wəʊnt/ /sliːp/ /ˈɜːli//", "bn_pron": "নো, দেই ওন্ট স্লীপ আলি।"}, {"speaker": "A", "type": "practice", "en": "Will they use the phone?", "bn": "তারা কি ফোনটি ব্যবহার করবে?", "ipa": "/wɪl /ðeɪ/ /juːয/ /ðə fəʊn/?", "bn_pron": "উইল দেই ইউয দা ফৌন?"}, {"speaker": "B", "type": "practice", "en": "Yes, they will use the phone.", "bn": "হ্যাঁ, তারা ফোনটি ব্যবহার করবে।", "ipa": "/jes /ðeɪ/ /wɪl/ /juːয/ /ðə fəʊn//", "bn_pron": "ইয়েস, দেই উইল ইউয দা ফৌন।"}, {"speaker": "A", "type": "real", "en": "What will you do tomorrow?", "bn": "তুমি আগামীকাল কী করবে?", "ipa": "/wɒt/ /wɪl/ /juː/ /duː/ /təˈmɒrəʊ/?", "bn_pron": "ওয়াট উইল ইউ ডু টুমরো?"}, {"speaker": "B", "type": "real", "en": "I will visit my grandparents.", "bn": "আমি আমার দাদা-দাদির সাথে দেখা করবো।", "ipa": "/aɪ/ /wɪl/ /ˈvɪzɪt/ /maɪ/ /ˈgrænpeərənts/.", "bn_pron": "আই উইল ভিজিট মাই গ্র্যান্ডপেরেন্টস।"}, {"speaker": "A", "type": "real", "en": "Will they cook something for you?", "bn": "তারা কি তোমার জন্য কিছু রান্না করবে?", "ipa": "/wɪl/ /ðeɪ/ /kʊk/ /ˈsʌmθɪŋ/ /fɔː/ /juː/?", "bn_pron": "উইল দেই কুক সামথিং ফো ইউ?"}, {"speaker": "B", "type": "real", "en": "Of course, they will make my favorite dish.", "bn": "অবশ্যই, তারা আমার পছন্দের খাবার বানাবে।", "ipa": "/ɒv/ /kɔːs/ /ðeɪ/ /wɪl/ /meɪk/ /maɪ/ /ˈfeɪvərɪt/ /dɪʃ/.", "bn_pron": "অব কোস, দেই উইল মেইক মাই ফেইভারিট ডিশ।"}]}];
        let currentLessonId = 1;
        let synthesis = window.speechSynthesis;

        function renderSidebar() {
            const list = document.getElementById('lesson-list');
            list.innerHTML = '';
            lessons.forEach(lesson => {
                const li = document.createElement('li');
                li.className = `lesson-btn p-3 rounded cursor-pointer transition-colors font-medium border border-transparent hover:border-indigo-200 hover:bg-indigo-50 text-gray-700 ${lesson.id === currentLessonId ? 'active' : ''}`;
                li.textContent = lesson.title;
                li.onclick = () => loadLesson(lesson.id);
                list.appendChild(li);
            });
        }

        function createBubble(line) {
            const isA = line.speaker === 'A';
            const isReal = line.type === 'real';
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isA ? 'justify-start' : 'justify-end'}`;
            
            const avatarColor = isReal ? (isA ? 'bg-orange-500' : 'bg-red-500') : (isA ? 'bg-indigo-500' : 'bg-emerald-500');
            const avatar = `<div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 ${avatarColor} ${isA ? 'mr-3' : 'ml-3'}">${line.speaker}</div>`;
            
            let bubbleClass = isA ? 'bg-white border border-gray-200 rounded-tl-none' : 'bg-indigo-50 border border-indigo-100 rounded-tr-none';
            if (isReal) bubbleClass = isA ? 'real-convo-bg rounded-tl-none' : 'bg-orange-100 border border-orange-200 rounded-tr-none';
            
            const bubble = `
                <div class="max-w-2xl p-4 rounded-2xl shadow-sm ${bubbleClass}">
                    <div class="font-bold text-lg text-gray-900 mb-1 flex justify-between items-center">
                        <span>${line.en}</span>
                        <button onclick="playSingle('${line.en.replace(/'/g, "\'")}')" class="ml-4 text-gray-400 hover:text-indigo-600" title="Listen">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                        </button>
                    </div>
                    <div class="text-md text-gray-700 font-medium mb-1">${line.bn}</div>
                    <div class="text-sm text-gray-500 font-mono tracking-wide mb-1">IPA: <span class="text-purple-600">${line.ipa}</span></div>
                    <div class="text-sm text-gray-600">উচ্চারণ: <span class="text-orange-600">${line.bn_pron}</span></div>
                </div>
            `;
            wrapper.innerHTML = isA ? avatar + bubble : bubble + avatar;
            return wrapper;
        }

        function loadLesson(id) {
            currentLessonId = id;
            synthesis.cancel();
            renderSidebar();
            
            const lesson = lessons.find(l => l.id === id);
            document.getElementById('lesson-title').textContent = lesson.title;
            document.getElementById('grammar-text').innerHTML = lesson.grammar;
            document.getElementById('multiple-ways-text').innerHTML = lesson.multiple_ways;
            
            const practiceContainer = document.getElementById('practice-container');
            const realContainer = document.getElementById('real-container');
            practiceContainer.innerHTML = '';
            realContainer.innerHTML = '';

            lesson.conversation.forEach((line) => {
                if (line.type === 'practice') {
                    practiceContainer.appendChild(createBubble(line));
                } else {
                    realContainer.appendChild(createBubble(line));
                }
            });
        }

        function playSingle(text) {
            synthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB'; 
            synthesis.speak(utterance);
        }

        function playFullAudio() {
            synthesis.cancel();
            const lesson = lessons.find(l => l.id === currentLessonId);
            lesson.conversation.forEach(line => {
                let utterance = new SpeechSynthesisUtterance(line.en);
                utterance.lang = 'en-GB';
                utterance.pitch = line.speaker === 'A' ? 1.0 : 1.2;
                synthesis.speak(utterance);
            });
        }

        loadLesson(1);
    </script>
